name: BuyBox Update

on:
  schedule:
    - cron: "0 6 * * *"   # batch 1 — 06:00 UTC diario
    - cron: "0 7 * * *"   # batch 2 — 07:00 UTC diario (1h después)
  workflow_dispatch:        # lanzamiento manual desde GitHub
    inputs:
      batch:
        description: "Batch a ejecutar (1, 2 o vacío para todos)"
        required: false
        default: ""

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine batch number
        id: batch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.batch }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "number=1" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            echo "number=2" >> $GITHUB_OUTPUT
          else
            echo "number=" >> $GITHUB_OUTPUT
          fi

      - name: Run BuyBox update
        run: npm start
        env:
          KEEPA_API_KEY:    ${{ secrets.KEEPA_API_KEY }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          MI_VENDEDOR_ID:   ${{ secrets.MI_VENDEDOR_ID }}
          SUPABASE_TABLE:   productos
          BATCH_NUMBER:     ${{ steps.batch.outputs.number }}
