name: BuyBox Update

on:
  schedule:
    - cron: "57 0,4,8,12,16,20 * * *"   # run 1: ES+FR, mitad 1 — tokens al máximo
    - cron: "57 1,5,9,13,17,21 * * *"   # run 2: ES+FR, mitad 2
    - cron: "57 2,6,10,14,18,22 * * *"  # run 3: IT+DE, mitad 1
    - cron: "57 3,7,11,15,19,23 * * *"  # run 4: IT+DE, mitad 2
  workflow_dispatch:
    inputs:
      run_number:
        description: "Run a ejecutar (1-4 o vacío para todos)"
        required: false
        default: ""

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine run number
        id: run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.run_number }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "57 0,4,8,12,16,20 * * *" ]; then
            echo "number=1" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "57 1,5,9,13,17,21 * * *" ]; then
            echo "number=2" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "57 2,6,10,14,18,22 * * *" ]; then
            echo "number=3" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "57 3,7,11,15,19,23 * * *" ]; then
            echo "number=4" >> $GITHUB_OUTPUT
          else
            echo "number=" >> $GITHUB_OUTPUT
          fi

      - name: Run BuyBox update
        run: npm start
        env:
          KEEPA_API_KEY:    ${{ secrets.KEEPA_API_KEY }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          MI_VENDEDOR_ID:   ${{ secrets.MI_VENDEDOR_ID }}
          SUPABASE_TABLE:   productos
          RUN_NUMBER:       ${{ steps.run.outputs.number }}
