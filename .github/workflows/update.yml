name: BuyBox Update

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      asins_override:
        description: "ASINs fijos (ej: B09XHLYYGB,B09XHPNMCW) — vacío usa rotación automática"
        required: false
        default: ""
      batch_size:
        description: "Productos por lote en rotación automática (default: 50)"
        required: false
        default: "50"
      clear_table:
        description: "Borrar toda la tabla antes de cargar (true/false)"
        required: false
        default: "false"
      run_mode:
        description: "Modo de ejecución: buybox (default) | ratings (solo actualiza ratings, más barato)"
        required: false
        default: "buybox"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run BuyBox update
        run: npm start
        env:
          KEEPA_API_KEY:    ${{ secrets.KEEPA_API_KEY }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          MI_VENDEDOR_ID:   ${{ secrets.MI_VENDEDOR_ID }}
          SUPABASE_TABLE:   productos
          ASINS_OVERRIDE:   ${{ github.event.inputs.asins_override }}
          BATCH_SIZE:       ${{ github.event.inputs.batch_size || '50' }}
          CLEAR_TABLE:      ${{ github.event.inputs.clear_table || 'false' }}
          RUN_MODE:         ${{ github.event.inputs.run_mode || 'buybox' }}
