name: BuyBox Update

on:
  workflow_dispatch:
    inputs:
      run_number:
        description: "Run a ejecutar: 1=ES, 2=FR, 3=IT, 4=DE, vacío=todos"
        required: false
        default: ""

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine run number
        id: run
        run: |
          echo "number=${{ github.event.inputs.run_number }}" >> $GITHUB_OUTPUT

      - name: Run BuyBox update
        run: npm start
        env:
          KEEPA_API_KEY:    ${{ secrets.KEEPA_API_KEY }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          MI_VENDEDOR_ID:   ${{ secrets.MI_VENDEDOR_ID }}
          SUPABASE_TABLE:   productos
          RUN_NUMBER:       ${{ steps.run.outputs.number }}
